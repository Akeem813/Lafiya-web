name: Mainnet release gate

on:
  workflow_dispatch:
    inputs:
      evidence_path:
        description: "Repository path to the approved, non-sensitive release evidence JSON"
        required: true
        type: string
      artifact_digest:
        description: "sha256 digest of the release artefact to verify provenance for"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: read

jobs:
  verify-gate:
    # Configure the mainnet Environment in GitHub with required reviewers who
    # do not have deploy credentials. This is the separation-of-duties control.
    environment: mainnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-gate.mjs "${{ inputs.evidence_path }}"
      # Surface error-budget status in the release job summary
      - name: Surface error-budget status
        if: always()
        run: |
          METRICS="release-evidence/error-budget-metrics.json"
          if [ -f "$METRICS" ]; then
            node -e "
              import('./scripts/error-budget.mjs').then(({ evaluateErrorBudget }) => {
                const fs = require('fs');
                const m = JSON.parse(fs.readFileSync('$METRICS', 'utf8'));
                const r = evaluateErrorBudget(m);
                const pct = (r.remainingFraction * 100).toFixed(1);
                const emoji = r.gateStatus === 'open' ? '✅' : r.gateStatus === 'warn' ? '⚠️' : '🚫';
                const summary = [
                  '## Error-budget status',
                  '',
                  \`| Metric | Value |\`,
                  \`| --- | --- |\`,
                  \`| SLO target | \${(r.sloTarget*100).toFixed(2)}% |\`,
                  \`| Budget total | \${r.errorBudgetMinutes.toFixed(2)} min |\`,
                  \`| Budget consumed | \${r.consumedMinutes.toFixed(2)} min (\${(r.consumedFraction*100).toFixed(1)}%) |\`,
                  \`| Budget remaining | \${r.remainingMinutes.toFixed(2)} min (\${pct}%) |\`,
                  \`| Gate status | \${emoji} \${r.gateStatus.toUpperCase()} |\`,
                  '',
                  r.gateReason,
                  '',
                ].join('\n');
                require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
              });
            " --input-type=module 2>/dev/null || echo "Error-budget evaluation skipped (metrics unavailable)."
          else
            echo "## Error-budget status" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ No error-budget metrics file found at \`release-evidence/error-budget-metrics.json\`." >> "$GITHUB_STEP_SUMMARY"
            echo "Add metrics before the next release for automated budget gating." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Verify the signed SLSA build provenance for the artefact before any
      # promotion. A missing or mismatched attestation fails the gate.
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "${{ inputs.evidence_path }}" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" \
            --source-digest "${{ github.sha }}" \
            --predicate-type "https://slsa.dev/provenance/v1"
          echo "${{ inputs.artifact_digest }}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      # A deployment step is intentionally absent until operators configure the
      # protected environment, managed credentials, and approved promotion target.
